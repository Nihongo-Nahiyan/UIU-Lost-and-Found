<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Report Found Item
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo-area">

            <div class="logo-box">
                L&F
            </div>

            <h2>
                UIU Lost & Found
            </h2>

        </div>


        <div class="nav-links">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="student-browse.html">
                Browse
            </a>

            <a href="report-lost.html">
                Report Lost
            </a>

            <a href="report-found.html"
               class="active">
                Report Found
            </a>

            <a href="#">
                My Claims
            </a>

            <a href="#">
                Messages
            </a>

        </div>


        <div class="student-area">

            <span>
                👤 Student
            </span>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </nav>

</header>



<main>

    <div class="form-page">


        <div class="page-title">

            <h1>
                Report Found Item
            </h1>

            <p>
                Fill in details about the item you found on campus.
            </p>

        </div>



        <div class="form-box">


            <label>
                Item Title
            </label>

            <input type="text"
                   placeholder="e.g. Found wallet near library">



            <div class="form-row">


                <div>

                    <label>
                        Category
                    </label>

                    <select>

                        <option>
                            Select Category
                        </option>

                        <option>
                            Electronics
                        </option>

                        <option>
                            Documents
                        </option>

                        <option>
                            Accessories
                        </option>

                        <option>
                            Clothing
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        Found Date
                    </label>

                    <input type="date">

                </div>


            </div>



            <label>
                Found Location
            </label>

            <input type="text"
                   placeholder="e.g. Library 2F Reading Room">



            <label>
                Description
            </label>

            <textarea
                placeholder="Describe the item in detail...">
            </textarea>



            <label>
                Upload Image
            </label>

            <input type="file">



            <div class="form-buttons">

                <button class="submit-button">
                    Submit Report
                </button>

                <a href="student-dashboard.html"
                   class="cancel-button">

                    Cancel

                </a>

            </div>


        </div>


    </div>

</main>



<footer>

    © 2026 UIU Lost & Found Portal ·
    United International University

</footer>


</body>

</html>
