<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

        <link rel="stylesheet" href="../css/public.css">

</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">

            <div class="logo">
                <span class="logo-box">L&F</span>
                <span>UIU Lost & Found</span>
            </div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="browse.html">Browse Items</a>
            </div>

            <div class="nav-buttons">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="register-btn">Register</a>
            </div>

        </nav>
    </header>


    <!-- LOGIN -->
    <main class="form-page">

        <div class="form-heading">

            <div class="login-logo">
                L&F
            </div>

            <h1>Welcome back</h1>

            <p>Sign in with your UIU email</p>

        </div>


        <div class="form-box">

            <label>UIU Email</label>

            <input type="email"
                   placeholder="name@uiu.ac.bd">


            <label>Password</label>

            <input type="password"
                   placeholder="Enter password">


            <a href="#" class="forgot">
                Forgot password?
            </a>


            <button class="form-button">
                Sign In
            </button>


            <p class="form-bottom">

                No account?

                <a href="register.html">
                    Register
                </a>

            </p>


            <hr>


            <p class="demo-text">
                Demo quick-login
            </p>


            <div class="demo-buttons">

    <a href="../student_part1/student-dashboard.html">
        Student Demo
    </a>

    <a href="../admin/admin-dashboard.html">
        Admin Demo
    </a>

</div>

        </div>

    </main>


    <footer>
        © 2026 UIU Lost & Found Portal · United International University
    </footer>

</body>

</html>
