<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

        <link rel="stylesheet" href="../css/public.css">


</head>


<body>


    <!-- NAVBAR -->
    <header>

        <nav class="navbar">

            <div class="logo">

                <span class="logo-box">
                    L&F
                </span>

                <span>
                    UIU Lost & Found
                </span>

            </div>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="browse.html">
                    Browse Items
                </a>

            </div>


            <div class="nav-buttons">

                <a href="login.html"
                   class="login-btn">

                    Login

                </a>


                <a href="register.html"
                   class="register-btn">

                    Register

                </a>

            </div>

        </nav>

    </header>



    <!-- REGISTER -->

    <main class="form-page">


        <div class="form-heading">

            <h1>Create Account</h1>

            <p>
                Register with your UIU email address
            </p>

        </div>



        <div class="form-box register-form">


            <div class="two-inputs">

                <div>

                    <label>
                        Full Name
                    </label>

                    <input type="text"
                           placeholder="Nadia Rahman">

                </div>


                <div>

                    <label>
                        Student ID
                    </label>

                    <input type="text"
                           placeholder="011221456">

                </div>

            </div>


            <label>
                UIU Email
            </label>

            <input type="email"
                   placeholder="name@uiu.ac.bd">


            <label>
                Phone
            </label>

            <input type="text"
                   placeholder="+880 1XXXXXXXXX">


            <label>
                Password
            </label>

            <input type="password"
                   placeholder="Min. 8 characters">


            <label>
                Confirm Password
            </label>

            <input type="password"
                   placeholder="Repeat password">


            <button class="form-button">
                Create Account
            </button>


            <p class="form-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer>

        © 2026 UIU Lost & Found Portal ·
        United International University

    </footer>


</body>

</html>
